<div id="crc">
<style>
#crc,#crc *{box-sizing:border-box}#crc{--r:#ff2f4e;--line:#ff5c7038;width:min(680px,100%);margin:24px auto;font:14px/1.55 Tahoma,"Noto Sans Thai",Arial,sans-serif;color:#fff}#crc .sh{padding:1px;border-radius:24px;background:linear-gradient(155deg,#ff5c749e,#ff2f4e0f 42%,#ff5c7461);box-shadow:0 28px 70px -26px #ff143499}#crc .bx{position:relative;overflow:hidden;border-radius:23px;background:linear-gradient(180deg,#1e040c,#0a0204 58%)}#crc .hd{position:relative;display:flex;align-items:center;gap:11px;min-height:64px;padding:13px 16px;background:linear-gradient(135deg,#7d0016,#df1434 52%,#8d001a);border-bottom:1px solid #ffffff1f}#crc .hd:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 160% at 10% -30%,#ffffff4d,transparent 58%)}#crc .hd:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,#ffffff99,transparent)}#crc .ic{position:relative;z-index:1;display:grid;place-items:center;flex:0 0 40px;width:40px;height:40px;border-radius:14px;background:#ffffff29;border:1px solid #ffffff47;font-size:19px;box-shadow:inset 0 1px 0 #ffffff59}#crc .tt{position:relative;z-index:1;font-size:18px;font-weight:800}#crc .ol{position:relative;z-index:1;display:flex;align-items:center;gap:7px;margin-left:auto;padding:7px 11px;border:1px solid #ffffff42;border-radius:99px;background:#1600066b;font-size:12px;white-space:nowrap}#crc .ol b{font-variant-numeric:tabular-nums}#crc .dot{width:8px;height:8px;border-radius:50%;background:#5dffa0;box-shadow:0 0 10px #5dffa0;animation:crP 1.6s ease-in-out infinite}@keyframes crP{50%{opacity:.4;transform:scale(.7)}}#crc .sg{position:relative;overflow:hidden}#crc .fa{position:absolute;left:0;right:0;height:26px;z-index:2;pointer-events:none}#crc .fa.t{top:0;background:linear-gradient(#10030699,transparent)}#crc .fa.b{bottom:0;background:linear-gradient(transparent,#100306cc)}#crc .ms{height:380px;overflow-y:auto;padding:18px 14px 10px;background:radial-gradient(60% 45% at 12% 4%,#ef233c29,transparent 62%),linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px),#0e0206;background-size:auto,26px 26px,26px 26px,auto;scrollbar-width:thin;scrollbar-color:#a4142c #1a040a}#crc .ms::-webkit-scrollbar{width:8px}#crc .ms::-webkit-scrollbar-thumb{background:linear-gradient(#c11430,#7d0018);border-radius:99px}#crc .mg{display:flex;gap:10px;margin-bottom:15px;animation:crIn .38s ease-out both}#crc .me{flex-direction:row-reverse}@keyframes crIn{from{opacity:0;transform:translateY(10px) scale(.985)}}#crc .av{flex:0 0 40px;width:40px;height:40px;overflow:hidden;display:grid;place-items:center;border-radius:50%;background:linear-gradient(150deg,#601020,#280610);box-shadow:0 0 0 1px #ff627873,0 0 0 4px #ff2f4e14;font-size:18px}#crc .me .av{background:linear-gradient(150deg,#ff3a57,#a20a23);box-shadow:0 0 0 1px #ff8c9e99,0 0 0 4px #ff2f4e24}#crc .bo{min-width:0;max-width:76%}#crc .nk{display:block;margin:0 0 5px 2px;color:#ff9cac;font-size:11.5px;font-weight:700}#crc .me .nk{margin:0 2px 5px 0;text-align:right;color:#ffd2da}#crc .bb{padding:10px 13px;border:1px solid var(--line);border-radius:7px 17px 17px 17px;background:linear-gradient(180deg,#4a0b1af2,#2a060ff2);box-shadow:0 8px 20px -12px #000000e6;line-height:1.55;overflow-wrap:anywhere}#crc .me .bb{border-radius:17px 7px 17px 17px;border-color:#ffa0af66;background:linear-gradient(135deg,#ff3a57,#c00d29 85%);box-shadow:0 10px 24px -12px #ff2f4ed9,inset 0 1px 0 #ffffff38}#crc .tm{display:block;margin:5px 0 0 3px;color:#c58e97;font-size:10.5px}#crc .me .tm{margin:5px 3px 0 0;text-align:right;color:#e7aeb7}#crc .ty .bb{display:inline-flex;align-items:center;gap:6px;padding:13px 15px}#crc .td{width:6px;height:6px;border-radius:50%;background:#ff97a7;animation:crT 1.3s ease-in-out infinite}#crc .td:nth-child(2){animation-delay:.18s}#crc .td:nth-child(3){animation-delay:.36s}@keyframes crT{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}#crc .ir{display:grid;grid-template-columns:138px 1fr auto;gap:10px;padding:13px;border-top:1px solid #ff425933;background:linear-gradient(180deg,#160309,#0a0204)}#crc .fi{position:relative;min-width:0}#crc .fi:before{content:"👤";position:absolute;top:50%;left:12px;transform:translateY(-50%);font-size:13px;opacity:.55;pointer-events:none}#crc input{width:100%;min-width:0;height:46px;padding:0 15px;border:1px solid #4d121e;border-radius:14px;outline:0;background:#210610;color:#fff;font:inherit;text-overflow:ellipsis;transition:.18s}#crc .fi input{padding-left:33px;font-weight:700;color:#ffc9d2}#crc input::placeholder{color:#9a656f;font-weight:400}#crc input:focus{border-color:var(--r);background:#280814;box-shadow:0 0 0 3px #ff2f4e29}#crc button{min-width:92px;height:46px;padding:0 16px;border:0;border-radius:14px;background:linear-gradient(135deg,#ff4460,#b40924);color:#fff;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 10px 22px -10px #ff2f4ee6,inset 0 1px 0 #ffffff40;transition:.15s}#crc button:hover{filter:brightness(1.1);transform:translateY(-1px)}#crc button:active{transform:scale(.98)}@media(max-width:560px){#crc .ir{grid-template-columns:104px 1fr auto}}@media(max-width:480px){#crc{margin:14px auto;font-size:13.5px}#crc .sh,#crc .bx{border-radius:18px}#crc .hd{min-height:56px;padding:11px 12px}#crc .ic,#crc .av{flex:0 0 34px;width:34px;height:34px;font-size:17px}#crc .tt{font-size:15.5px}#crc .ol{font-size:10.5px;padding:5px 8px}#crc .ms{height:330px;padding:14px 10px 8px}#crc .bo{max-width:80%}#crc .ir{padding:10px;gap:7px;grid-template-columns:86px 1fr auto}#crc .fi:before{left:9px}#crc .fi input{padding-left:25px}#crc input{height:42px;padding:0 11px}#crc button{min-width:58px;height:42px;padding:0 9px}}@media(prefers-reduced-motion:reduce){#crc *,#crc *:before,#crc *:after{animation:none!important;transition:none!important}}
</style>
<div class="sh"><div class="bx">
<header class="hd"><span class="ic">💬</span><span class="tt">ห้องแชทรวม</span><span class="ol"><i class="dot"></i><b data-online>1,273</b> คนออนไลน์</span></header>
<div class="sg"><span class="fa t"></span><span class="fa b"></span>
<div class="ms" data-messages aria-live="polite"></div></div>
<form class="ir" data-form><span class="fi"><input data-name maxlength="20" autocomplete="off" placeholder="ตั้งชื่อของคุณ"></span><input data-input maxlength="180" autocomplete="off" placeholder="ร่วมพูดคุยกับลูกค้าคนอื่นๆ..."><button type="submit">➤ ส่ง</button></form>
</div></div>
<script>
(()=>{const r=document.getElementById("crc"),q=s=>r.querySelector(s),b=q("[data-messages]"),f=q("[data-form]"),i=q("[data-input]"),nm=q("[data-name]"),o=q("[data-online]");
const P=[["ลูกค้า VIP","วันนี้มีใครได้โบนัสบ้างครับ"],["มินนี่","เพิ่งเข้ามาค่ะ บรรยากาศคึกคักมาก"],["ต้นสายแดง","แอดมินตอบเร็วดีครับ"],["คุณนัท","ขอให้วันนี้เป็นวันที่ดีของทุกคนครับ"],["เมย์","เข้ามาทักทายค่ะ 😊"],["บอล","ระบบใช้งานง่ายดีครับ"]];
const esc=v=>{const e=document.createElement("div");e.textContent=v;return e.innerHTML},tm=()=>new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"}),stick=()=>{try{b.scrollTo({top:b.scrollHeight,behavior:"smooth"})}catch(e){b.scrollTop=b.scrollHeight}};
try{const s=localStorage.getItem("crcName");if(s)nm.value=s}catch(e){}
nm.addEventListener("change",()=>{try{localStorage.setItem("crcName",nm.value.trim())}catch(e){}});
function add(n,t,me){const x=document.createElement("div");x.className="mg"+(me?" me":"");x.innerHTML='<div class="av">👤</div><div class="bo"><span class="nk">'+esc(n)+'</span><div class="bb">'+esc(t)+'</div><span class="tm">'+tm()+'</span></div>';b.appendChild(x);while(b.children.length>18)b.firstElementChild.remove();stick()}
let tp=null;const hide=()=>{if(tp){tp.remove();tp=null}},show=()=>{hide();tp=document.createElement("div");tp.className="mg ty";tp.innerHTML='<div class="av">👤</div><div class="bo"><div class="bb"><i class="td"></i><i class="td"></i><i class="td"></i></div></div>';b.appendChild(tp);stick()};
let k=4;for(let j=0;j<4;j++)add(P[j][0],P[j][1]);
(function cy(){const p=P[k%P.length];show();setTimeout(()=>{hide();add(p[0],p[1]);k++;setTimeout(cy,4500)},Math.min(6e3,Math.max(1e3,700+p[1].length*75)))})();
setInterval(()=>{const n=+o.textContent.replace(/,/g,"")||1273;o.textContent=Math.max(900,n+Math.floor(Math.random()*15)-7).toLocaleString("th-TH")},3500);
f.addEventListener("submit",e=>{e.preventDefault();const t=i.value.trim();if(!t)return;add(nm.value.trim().slice(0,20)||"คุณ",t,1);i.value="";i.focus()})})()
</script>
</div>
