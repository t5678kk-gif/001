<script>
(() => {
  // 1. ดักการคลิกขวา (ห้ามคลิกขวาเพื่อกด Inspect หรือคัดลอก)
  document.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    return false;
  });

  // 2. ดักการกดปุ่ม F12, Ctrl+U (ดู Source Code) และ Ctrl+Shift+I / J / C (เปิด DevTools)
  document.addEventListener('keydown', (e) => {
    if (
      e.key === 'F12' ||
      (e.ctrlKey && (e.key === 'u' || e.key === 'U')) ||
      (e.ctrlKey && e.shiftKey && ['I', 'i', 'J', 'j', 'C', 'c'].includes(e.key))
    ) {
      e.preventDefault();
      return false;
    }
  });

  // 3. ห้ามคลิกลากรูปภาพหรือข้อความ
  document.addEventListener('dragstart', (e) => {
    e.preventDefault();
  });
})();
</script>
