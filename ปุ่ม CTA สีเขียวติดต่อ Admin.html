<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap');
.vl-box{display:flex;justify-content:center;width:100%;padding:10px 0;font-family:'Kanit',sans-serif}
.vl-btn{position:relative;width:100%;max-width:440px;padding:2px;border-radius:99px;text-decoration:none;background:linear-gradient(135deg,#b9f6ca,#00c853 25%,#69f0ae 50%,#00701a 75%,#00e676);box-shadow:0 8px 25px rgba(0,0,0,.6),0 0 20px rgba(0,230,118,.35);transition:transform .25s,box-shadow .25s;display:block;-webkit-tap-highlight-color:transparent;cursor:pointer;-webkit-backface-visibility:hidden;backface-visibility:hidden;transform:translate3d(0,0,0)}
.vl-btn:active{transform:scale(.98)}
.vl-btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 10px 30px rgba(0,0,0,.7),0 0 30px rgba(0,230,118,.6)}
.vl-in{position:relative;min-height:76px;background:radial-gradient(ellipse at 50% 50%,rgba(0,230,118,.15),transparent 70%),linear-gradient(180deg,#0b1a10,#030805);border-radius:99px;display:grid;grid-template-columns:52px 1fr 40px;align-items:center;padding:6px 14px;overflow:hidden;isolation:isolate;-webkit-mask-image:-webkit-radial-gradient(white,black)}
/* แก้บั๊กแสงวิ่ง: เพิ่ม pointer-events: none และใช้ translate3d */
.vl-in::before{content:'';position:absolute;top:-50%;left:0;width:40%;height:200%;background:linear-gradient(90deg,transparent,rgba(185,246,202,.45),transparent);transform:translate3d(-150%,0,0) rotate(25deg);animation:vSw 3.5s infinite;pointer-events:none;z-index:1}
@keyframes vSw{0%,30%{transform:translate3d(-150%,0,0) rotate(25deg)}70%,100%{transform:translate3d(350%,0,0) rotate(25deg)}}
.vl-ico{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#69f0ae,#00e676 40%,#008f3a);box-shadow:0 0 0 2px #b9f6ca,0 0 0 3px #004d20,0 0 16px rgba(0,230,118,.7);display:flex;align-items:center;justify-content:center;animation:vWig 2.8s infinite;flex-shrink:0;z-index:2}
@keyframes vWig{0%,100%{transform:none}6%{transform:scale(1.15) rotate(-14deg)}12%{transform:scale(1.15) rotate(14deg)}18%{transform:scale(1.1) rotate(-8deg)}24%{transform:none}}
.vl-ico svg{width:32px;height:32px;fill:#fff}
.vl-txt{text-align:center;padding:0 2px;z-index:2}
.vl-t{position:relative;display:inline-block;font-size:clamp(20px,5vw,25px);font-weight:600;background:linear-gradient(115deg,#b9f6ca,#00e676 25%,#fff 50%,#69f0ae 75%,#00a844);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 8px rgba(0,230,118,.6))}
/* กันระบบแปลภาษาแทรก font แล้วตัวหนังสือล่องหน */
.vl-t font{color:#00e676 !important;-webkit-text-fill-color:#00e676 !important;-webkit-background-clip:unset !important}
.sp{position:absolute;font-size:12px;color:#fff;animation:vSp 2s infinite;-webkit-text-fill-color:#fff;text-shadow:0 0 6px #69f0ae;pointer-events:none}
.s1{top:-6px;left:-6px}
.s2{top:-10px;left:42%;animation-delay:.5s}
.s3{top:-6px;right:-8px;animation-delay:1s}
.s4{bottom:-6px;right:20%;animation-delay:1.5s}
@keyframes vSp{0%,100%{transform:scale(0);opacity:0}35%{transform:scale(1.3);opacity:1}70%{transform:scale(0);opacity:0}}
.vl-s{font-size:clamp(12px,3vw,14px);color:#eee;margin-top:2px}
.vl-s span{color:#00e676;font-weight:600;animation:vBk 1.4s infinite}
@keyframes vBk{0%,100%{opacity:1}50%{opacity:.3}}
.vl-arr{width:34px;height:34px;border-radius:50%;background:rgba(0,230,118,.15);border:1.5px solid rgba(0,230,118,.5);display:flex;align-items:center;justify-content:center;color:#00e676;margin-left:auto;transition:.2s;z-index:2}
.vl-arr svg{width:18px;height:18px;fill:currentColor}
.vl-btn:active .vl-arr,
.vl-btn:hover .vl-arr{background:#00e676;color:#041208;border-color:#fff;box-shadow:0 0 20px #00e676,0 0 35px #00e676;transform:scale(1.12)}
@media(max-width:480px){.vl-in{grid-template-columns:44px 1fr 34px;min-height:68px;padding:6px 10px}.vl-ico{width:44px;height:44px}.vl-ico svg{width:28px;height:28px}.vl-arr{width:30px;height:30px}}
</style>
