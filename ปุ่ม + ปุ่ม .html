<div class="cta-wrap">
  <style>
    @property --cta-ang{syntax:"<angle>";initial-value:0deg;inherits:false}

    .cta-wrap{
      --red-300:#FF6272;
      --red-500:#E11D2E;
      --red-600:#B90F1E;
      --red-700:#7E0512;
      --glow:rgba(225,29,46,.55);
      --wrap-gap:2px;
      --cta-max:520px;
      display:flex;
      justify-content:center;
      width:100%;
      padding:var(--wrap-gap) 4px;
      box-sizing:border-box;
      padding-top:16px;
    }
    .cta-wrap *{box-sizing:border-box}

    .cta-shell{
      position:relative;
      width:100%;
      max-width:var(--cta-max);
      padding:2px;
      border-radius:18px;
      isolation:isolate;
    }
    .cta-shell::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      background:conic-gradient(from var(--cta-ang),
        rgba(255,255,255,0) 0 52%,
        rgba(255,138,150,.9) 68%,
        #fff 76%,
        rgba(255,91,107,.9) 84%,
        rgba(255,255,255,0) 100%);
      animation:cta-spin 5s linear infinite;
      z-index:-1;
    }
    .cta-shell::after{
      content:"";
      position:absolute;
      inset:10px 14px;
      border-radius:inherit;
      background:var(--glow);
      filter:blur(20px);
      opacity:.45;
      z-index:-2;
      animation:cta-breathe 3.2s ease-in-out infinite;
      transition:opacity .3s ease;
    }
    @keyframes cta-spin{to{--cta-ang:360deg}}
    @keyframes cta-breathe{0%,100%{opacity:.35}50%{opacity:.7}}

    .cta-btn{
      --h:clamp(52px,6.4vw,64px);
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      width:100%;
      min-height:var(--h);
      padding:0 clamp(22px,4vw,34px);
      font-family:"Noto Sans Thai","Prompt","Kanit",system-ui,-apple-system,sans-serif;
      font-size:clamp(15px,1.6vw,18px);
      font-weight:800;
      letter-spacing:.2px;
      line-height:1;
      color:#fff;
      text-decoration:none;
      white-space:nowrap;
      border:0;
      border-radius:16px;
      background:
        radial-gradient(120% 90% at 50% -20%,rgba(255,255,255,.35),transparent 60%),
        linear-gradient(160deg,var(--red-300) 0%,var(--red-500) 48%,var(--red-600) 100%);
      box-shadow:
        0 6px 0 var(--red-700),
        0 14px 30px rgba(142,7,20,.38),
        inset 0 1px 0 rgba(255,255,255,.34),
        inset 0 -10px 20px rgba(0,0,0,.20);
      cursor:pointer;
      overflow:hidden;
      -webkit-tap-highlight-color:transparent;
      transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease,filter .2s ease;
    }
    .cta-btn>*{position:relative;z-index:3}

    .cta-btn::before{
      content:"";
      position:absolute;
      inset:-20% -10%;
      background:linear-gradient(100deg,transparent 38%,rgba(255,255,255,.42) 50%,transparent 62%);
      transform:translateX(-130%) skewX(-14deg);
      animation:cta-shine 4.2s ease-in-out infinite;
      pointer-events:none;
      z-index:2;
    }
    @keyframes cta-shine{0%,72%{transform:translateX(-130%) skewX(-14deg)}100%{transform:translateX(130%) skewX(-14deg)}}

    .cta-spot{
      position:absolute;
      inset:0;
      background:radial-gradient(170px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.38),transparent 62%);
      opacity:0;
      transition:opacity .25s ease;
      pointer-events:none;
      z-index:1;
    }

    .cta-ico{
      display:grid;
      place-items:center;
      width:1.95em;
      height:1.95em;
      flex:0 0 auto;
      border-radius:50%;
      background:rgba(255,255,255,.16);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.45);
      transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .25s ease;
    }
    .cta-ico svg{width:1.05em;height:1.05em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

    .cta-txt{
      background:linear-gradient(100deg,#fff 42%,#FFD9DE 50%,#fff 58%);
      background-size:260% 100%;
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
      animation:cta-txt 4.2s linear infinite;
    }
    @keyframes cta-txt{0%{background-position:160% 0}100%{background-position:-60% 0}}

    .cta-arw{
      width:1.05em;height:1.05em;flex:0 0 auto;
      fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
      opacity:.75;
      transition:transform .25s ease,opacity .25s ease;
    }

    .cta-rip{
      position:absolute;
      width:16px;height:16px;
      margin:-8px 0 0 -8px;
      border-radius:50%;
      background:rgba(255,255,255,.55);
      transform:scale(0);
      animation:cta-ripple .6s ease-out forwards;
      pointer-events:none;
      z-index:2;
    }
    @keyframes cta-ripple{to{transform:scale(26);opacity:0}}

    @media (hover:hover) and (pointer:fine){
      .cta-btn:hover{
        transform:translateY(-4px);
        filter:brightness(1.05) saturate(1.05);
        box-shadow:
          0 10px 0 var(--red-700),
          0 20px 36px rgba(142,7,20,.46),
          inset 0 1px 0 rgba(255,255,255,.4),
          inset 0 -10px 20px rgba(0,0,0,.2);
      }
      .cta-btn:hover .cta-spot{opacity:1}
      .cta-btn:hover .cta-ico{transform:rotate(-8deg) scale(1.08);background:rgba(255,255,255,.26)}
      .cta-btn:hover .cta-arw{transform:translateX(4px);opacity:1}
      .cta-shell:hover::after{opacity:.85}
    }

    .cta-btn:active{
      transform:translateY(6px) scale(.985);
      box-shadow:
        0 0 0 var(--red-700),
        0 4px 10px rgba(142,7,20,.35),
        inset 0 3px 8px rgba(0,0,0,.28);
      transition-duration:.06s;
    }

    .cta-btn:focus-visible{
      outline:3px solid #fff;
      outline-offset:3px;
    }

    @media (max-width:380px){.cta-shell{border-radius:16px}.cta-btn{border-radius:14px;gap:9px}}
    @media (min-width:768px){.cta-wrap{--cta-max:620px}}
    @media (min-width:1200px){.cta-wrap{--cta-max:720px}}

    /* ป้าย 3 ขั้นตอน */
    .cta-badge{
      position:absolute;
      top:-14px;
      left:50%;
      z-index:4;
      display:flex;
      align-items:center;
      gap:5px;
      padding:5px 13px;
      border-radius:999px;
      font:800 clamp(11px,1.2vw,13px)/1 "Noto Sans Thai",Prompt,Kanit,sans-serif;
      white-space:nowrap;
      color:#5B0512;
      background:linear-gradient(145deg,#FFF6CF,#FFD75E 46%,#F5AE22);
      border:1.5px solid #ffffffeb;
      box-shadow:0 5px 14px #78300059;
      overflow:hidden;
      pointer-events:none;
      transform:translateX(-50%);
      animation:cta-bd-up 2.8s ease-in-out infinite
    }
    .cta-badge>*{position:relative;z-index:2}
    .cta-badge::after{
      content:"";
      position:absolute;
      inset:0;
      z-index:1;
      background:linear-gradient(100deg,#fff0 40%,#ffffffd9 50%,#fff0 60%);
      transform:translateX(-130%);
      animation:cta-bd-sh 4.2s ease-in-out infinite
    }
    .cta-badge i{
      width:5px;
      height:5px;
      flex:0 0 auto;
      border-radius:50%;
      background:#C21024;
      opacity:.35;
      animation:cta-bd-dot 1.5s ease-in-out infinite
    }
    .cta-badge i:nth-of-type(2){animation-delay:.22s}
    .cta-badge i:nth-of-type(3){animation-delay:.44s}
    @keyframes cta-bd-up{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-3px)}}
    @keyframes cta-bd-sh{0%,70%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
    @keyframes cta-bd-dot{0%,100%{opacity:.3;transform:scale(1)}40%{opacity:1;transform:scale(1.4)}}

    @media (prefers-reduced-motion:reduce){
      .cta-shell::before,.cta-shell::after,.cta-btn::before,.cta-txt,.cta-rip,.cta-badge,.cta-badge::after,.cta-badge i{animation:none}
      .cta-txt{-webkit-text-fill-color:#fff}
      .cta-btn{transition:none}
    }
  </style>

  <div class="cta-shell">
    <span class="cta-badge">
      <i></i><i></i><i></i>
      <span>สมัครเองง่ายๆ 3ขั้นตอนเท่านั้น</span>
    </span>
    <a class="cta-btn" href="https://mallth.zenithxx.com/register" target="_blank" rel="noopener noreferrer">
      <span class="cta-spot" aria-hidden="true"></span>
      <span class="cta-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M16 20v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V20"/>
          <circle cx="9" cy="7" r="3.5"/>
          <path d="M19 7v6M22 10h-6"/>
        </svg>
      </span>
      <span class="cta-txt">สมัครสมาชิก</span>
      <svg class="cta-arw" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </a>
  </div>

  <script>
  (function(){
    document.querySelectorAll('.cta-wrap .cta-btn').forEach(function(b){
      if(b.dataset.ctaOn) return; b.dataset.ctaOn = 1;
      b.addEventListener('pointermove', function(e){
        var r = b.getBoundingClientRect();
        b.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        b.style.setProperty('--my', (e.clientY - r.top) + 'px');
      });
      b.addEventListener('pointerdown', function(e){
        var r = b.getBoundingClientRect(), s = document.createElement('span');
        s.className = 'cta-rip';
        s.style.left = (e.clientX - r.left) + 'px';
        s.style.top  = (e.clientY - r.top) + 'px';
        b.appendChild(s);
        setTimeout(function(){ s.remove(); }, 650);
      });
    });
  })();
  </script>
</div>
