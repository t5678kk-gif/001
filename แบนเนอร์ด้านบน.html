<style>
.wide-banner-box {
  position: relative;
  width: 100%;
  max-width: 780px; /* ปรับให้กว้างขึ้น เพื่อให้ภาพขยายใหญ่และสูงขึ้นตามธรรมชาติ */
  margin: 0 auto;
  padding: 8px 6px;
  display: flex;
  justify-content: center;
  box-sizing: border-box;
}

/* แสงพื้นหลังนิ่ง ไม่กินสเปก */
.wide-banner-ambient {
  position: absolute;
  top: 8px;
  left: 10px;
  right: 10px;
  bottom: 8px;
  background: radial-gradient(ellipse at 50% 50%, rgba(255, 60, 0, 0.45) 0%, rgba(255, 175, 0, 0.25) 55%, transparent 75%);
  filter: blur(18px);
  opacity: 0.85;
  z-index: 0;
  pointer-events: none;
}

/* ขอบแสงสีทองนิ่ง */
.wide-banner-inner {
  position: relative;
  width: 100%;
  border-radius: 18px;
  overflow: hidden;
  z-index: 1;
  background: #000;
  border: 1.5px solid rgba(255, 200, 0, 0.65);
  box-shadow: 0 0 20px rgba(255, 160, 0, 0.4), 0 0 35px rgba(255, 50, 0, 0.25);
  transition: transform 0.3s ease;
  box-sizing: border-box;
}

.wide-banner-inner:hover {
  transform: translateY(-2px) scale(1.01);
}

/* คืนค่าสัดส่วนภาพจริง ไม่ตัดขอบซ้ายขวา */
.wide-banner-img {
  width: 100%;
  height: auto; /* ไม่บังคับความสูง รูปจะแสดงครบ 100% ไม่โดนตัด */
  display: block;
  border-radius: 18px;
}

/* เส้นแสงวิ่งผ่านเบาๆ */
.wide-banner-inner::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -100%;
  width: 40%;
  height: 200%;
  background: linear-gradient(90deg, transparent, rgba(255, 240, 180, 0.4), transparent);
  transform: rotate(20px);
  animation: wideLightSweep 4s infinite;
  z-index: 2;
  pointer-events: none;
}

/* ประกายดาว */
.w-sparkle {
  position: absolute;
  color: #fff;
  font-size: 13px;
  pointer-events: none;
  z-index: 3;
  text-shadow: 0 0 8px #ffd700;
  animation: wideSparkleTwinkle 2.5s infinite ease-in-out;
}

.w-sp1 { top: 8px; left: 16px; animation-delay: 0s; }
.w-sp2 { top: 8px; left: 48%; animation-delay: 0.8s; font-size: 15px; }
.w-sp3 { top: 8px; right: 16px; animation-delay: 1.6s; font-size: 14px; }
.w-sp4 { bottom: 8px; left: 22%; animation-delay: 1.2s; font-size: 11px; }
.w-sp5 { bottom: 8px; right: 20%; animation-delay: 2s; font-size: 13px; }

@keyframes wideLightSweep {
  0%, 35% { left: -100%; }
  70%, 100% { left: 170%; }
}

@keyframes wideSparkleTwinkle {
  0%, 100% { transform: scale(0); opacity: 0; }
  50% { transform: scale(1.2); opacity: 1; }
}

/* ปรับแต่งสำหรับหน้าจอมือถือ */
@media (max-width: 576px) {
  .wide-banner-box { padding: 4px; }
  .wide-banner-inner { border-radius: 14px; }
  .wide-banner-img { 
    height: auto; 
    border-radius: 14px; 
  }
  .wide-banner-ambient { top: 4px; left: 6px; right: 6px; bottom: 4px; filter: blur(12px); }
  .w-sparkle { font-size: 10px; }
}
</style>

<div class="wide-banner-box">
  <div class="wide-banner-ambient"></div>
  <div class="wide-banner-inner">
    <span class="w-sparkle w-sp1">✦</span>
    <span class="w-sparkle w-sp2">✦</span>
    <span class="w-sparkle w-sp3">✦</span>
    <span class="w-sparkle w-sp4">✦</span>
    <span class="w-sparkle w-sp5">✦</span>
    <img class="wide-banner-img" 
         src="https://media.mssg.space/thumbnails/medium/w/6ab822000b31e58f7b64be76/websites/6ab822107aa4cf374ab37dbb/1787158490_d7ecde3ec752a1578045_(1)_(1)_1790526531925.png" 
         alt="ANGPAO Banner"
         fetchpriority="high"
         decoding="async"
         loading="eager">
  </div>
</div>
