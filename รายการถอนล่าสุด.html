<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap');
.withdraw-wrapper{width:100%;max-width:820px;margin:auto;font-family:'Kanit',sans-serif;color:#fff5f5;padding:10px 0}
.withdraw-header{display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;font-size:22px;font-weight:700;margin-bottom:15px;text-shadow:0 0 15px rgba(255,42,68,.7)}
.live-dot{width:9px;height:9px;border-radius:50%;background:#ff2a44;box-shadow:0 0 8px #ff2a44,0 0 16px #ff0033;animation:wPulse 1.5s infinite}
@keyframes wPulse{50%{transform:scale(1.4);opacity:.5}}
.withdraw-list{display:flex;flex-direction:column;gap:10px}
.withdraw-card{position:relative;display:flex;align-items:center;justify-content:space-between;min-height:85px;padding:12px 18px;border:1px solid rgba(255,56,80,.25);border-radius:18px;background:linear-gradient(135deg,rgba(180,20,40,.2),transparent 50%),linear-gradient(180deg,#20070a,#110305);box-shadow:0 10px 25px rgba(0,0,0,.5);overflow:hidden;animation:wCardIn .5s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes wCardIn{from{opacity:0;transform:translateY(-15px)}to{opacity:1;transform:translateY(0)}}
.card-left{display:flex;align-items:center;gap:12px;flex:1;min-width:0;z-index:2}
.bank-icon-box{width:46px;height:46px;min-width:46px;border-radius:50%;overflow:hidden;background:#fff;border:2px solid rgba(255,75,95,.8);box-shadow:0 0 15px rgba(255,42,68,.3)}
.bank-img{width:100%;height:100%;object-fit:cover}
.user-info{display:flex;flex-direction:column;gap:1px;min-width:0}
.info-row{max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:14px;color:#fff0f2}
.font-bold{font-weight:700}
.amount{color:#ff3355;text-shadow:0 0 10px rgba(255,51,85,.5)}
.date-row{margin-top:2px;color:#e88591;font-size:11px;opacity:.9}
.status-badge{z-index:2;display:flex;align-items:center;justify-content:center;gap:6px;min-width:95px;padding:6px 12px;border-radius:999px;color:#fff;font-size:12px;font-weight:600;flex-shrink:0}
.processing{background:linear-gradient(135deg,#820815,#b51225);box-shadow:0 4px 15px rgba(200,20,40,.3)}
.success{background:linear-gradient(135deg,#c40e24,#ff2a44);box-shadow:0 4px 18px rgba(255,42,68,.4)}
.badge-icon svg{width:14px;height:14px;fill:#fff;display:block}
.spinner{animation:wSpin 1s linear infinite}
@keyframes wSpin{to{transform:rotate(360deg)}}
</style>

<div class="withdraw-wrapper">
  <div class="withdraw-header">
    <span class="live-dot"></span> รายการถอนล่าสุด
  </div>
  <div id="withdraw-list" class="withdraw-list"></div>
</div>

<script>
(()=>{
const list=document.getElementById('withdraw-list');
const MAX=5, INT=3500;
const BANKS=[
 {name:'SCB',img:'https://templat.advlnw.com/template/22/img/banks/scb.webp'},
 {name:'KBANK',img:'https://templat.advlnw.com/template/22/img/banks/kbank.webp'},
 {name:'KTB',img:'https://templat.advlnw.com/template/22/img/banks/ktb.webp'},
 {name:'TTB',img:'https://templat.advlnw.com/template/22/img/banks/ttb.webp'},
 {name:'BAY',img:'https://templat.advlnw.com/template/22/img/banks/bay.webp'},
 {name:'BBL',img:'https://templat.advlnw.com/template/22/img/banks/bbl.webp'}
];
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const fmt=n=>n.toLocaleString('th-TH');
const chkIcon='<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
const spnIcon='<svg class="spinner" viewBox="0 0 24 24"><path d="M12 4V2C6.48 2 2 6.48 2 12h2c0-4.41 3.59-8 8-8zm0 14c4.41 0 8-3.59 8-8h2c0 5.52-4.48 10-10 10v-2z"/></svg>';

function createCard(){
  const b=BANKS[rand(0,BANKS.length-1)];
  const amt=rand(500,50000);
  const card=document.createElement('div');
  card.className='withdraw-card';
  card.innerHTML=`
    <div class="card-left">
      <div class="bank-icon-box"><img class="bank-img" src="${b.img}" alt="${b.name}"></div>
      <div class="user-info">
        <div class="info-row font-bold">ยูสเซอร์: cdeexxxx${rand(10000,99900)}</div>
        <div class="info-row font-bold">ยอดถอน: <span class="amount">${fmt(amt)}</span> บาท</div>
        <div class="date-row">${new Date().toLocaleString('th-TH',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})}</div>
      </div>
    </div>
    <div class="status-badge processing"><div class="badge-icon">${spnIcon}</div><span>กำลังโอน</span></div>
  `;
  setTimeout(()=>{
    const badge=card.querySelector('.status-badge');
    if(badge){
      badge.className='status-badge success';
      badge.innerHTML=`<div class="badge-icon">${chkIcon}</div><span>โอนแล้ว</span>`;
    }
  },rand(2000,4500));
  return card;
}

function add(){
  list.prepend(createCard());
  while(list.children.length>MAX) list.lastElementChild.remove();
}

for(let i=0;i<MAX;i++) add();
setInterval(add,INT);
})();
</script>
