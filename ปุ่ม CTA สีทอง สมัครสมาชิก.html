<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap');
.vg-box{display:flex;justify-content:center;width:100%;padding:10px 0;font-family:'Kanit',sans-serif}
.vg-btn{position:relative;width:100%;max-width:440px;padding:2px;border-radius:99px;text-decoration:none;background:linear-gradient(135deg,#fff7b2,#e09f00 25%,#ffea79 50%,#996200 75%,#ffd438);box-shadow:0 8px 25px rgba(0,0,0,.6),0 0 20px rgba(255,180,0,.35);transition:transform .25s,box-shadow .25s;display:block;-webkit-tap-highlight-color:transparent;cursor:pointer;-webkit-backface-visibility:hidden;backface-visibility:hidden;transform:translate3d(0,0,0)}
.vg-btn:active{transform:scale(.98)}
.vg-btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 10px 30px rgba(0,0,0,.7),0 0 30px rgba(255,200,0,.6)}
.vg-in{position:relative;min-height:76px;background:radial-gradient(ellipse at 50% 50%,rgba(255,195,0,.15),transparent 70%),linear-gradient(180deg,#181207,#050402);border-radius:99px;display:grid;grid-template-columns:52px 1fr 40px;align-items:center;padding:6px 14px;overflow:hidden;isolation:isolate;-webkit-mask-image:-webkit-radial-gradient(white,black)}
/* แก้บั๊กแสงวิ่ง: เพิ่ม pointer-events: none และใช้ translate3d */
.vg-in::before{content:'';position:absolute;top:-50%;left:0;width:40%;height:200%;background:linear-gradient(90deg,transparent,rgba(255,245,180,.45),transparent);transform:translate3d(-150%,0,0) rotate(25deg);animation:gSw 3.5s infinite;pointer-events:none;z-index:1}
@keyframes gSw{0%,30%{transform:translate3d(-150%,0,0) rotate(25deg)}70%,100%{transform:translate3d(350%,0,0) rotate(25deg)}}
.vg-ico{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7b2,#ffd000 40%,#996200);box-shadow:0 0 0 2px #fff2a3,0 0 0 3px #6e4600,0 0 16px rgba(255,200,0,.7);display:flex;align-items:center;justify-content:center;animation:gWig 2.8s infinite;flex-shrink:0;z-index:2}
@keyframes gWig{0%,100%{transform:none}6%{transform:scale(1.15) rotate(-14deg)}12%{transform:scale(1.15) rotate(14deg)}18%{transform:scale(1.1) rotate(-8deg)}24%{transform:none}}
.vg-ico svg{width:34px;height:34px;fill:#140d00}
.vg-txt{text-align:center;padding:0 2px;z-index:2}
.vg-t{position:relative;display:inline-block;font-size:clamp(20px,5vw,25px);font-weight:600;background:linear-gradient(115deg,#fff7b2,#ffd000 25%,#fff 50%,#ffea79 75%,#d48b00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 8px rgba(255,200,0,.6))}
/* กันระบบแปลภาษาแทรก font แล้วตัวหนังสือล่องหน */
.vg-t font{color:#ffd000 !important;-webkit-text-fill-color:#ffd000 !important;-webkit-background-clip:unset !important}
.gsp{position:absolute;font-size:12px;color:#fff;animation:gSp 2s infinite;-webkit-text-fill-color:#fff;text-shadow:0 0 6px #ffe066;pointer-events:none}
.s1{top:-6px;left:-6px}
.s2{top:-10px;left:42%;animation-delay:.5s}
.s3{top:-6px;right:-8px;animation-delay:1s}
.s4{bottom:-6px;right:20%;animation-delay:1.5s}
@keyframes gSp{0%,100%{transform:scale(0);opacity:0}35%{transform:scale(1.3);opacity:1}70%{transform:scale(0);opacity:0}}
.vg-s{font-size:clamp(12px,3vw,14px);color:#eee;margin-top:2px}
.vg-s span{color:#ffd000;font-weight:600;animation:gBk 1.4s infinite}
@keyframes gBk{0%,100%{opacity:1}50%{opacity:.3}}
.vg-arr{width:34px;height:34px;border-radius:50%;background:rgba(255,208,0,.15);border:1.5px solid rgba(255,208,0,.5);display:flex;align-items:center;justify-content:center;color:#ffd000;margin-left:auto;transition:.2s;z-index:2}
.vg-arr svg{width:18px;height:18px;fill:currentColor}
.vg-btn:active .vg-arr,
.vg-btn:hover .vg-arr{background:#ffd000;color:#140d00;border-color:#fff;box-shadow:0 0 20px #ffd000,0 0 35px #ffd000;transform:scale(1.12)}
@media(max-width:480px){.vg-in{grid-template-columns:44px 1fr 34px;min-height:68px;padding:6px 10px}.vg-ico{width:44px;height:44px}.vg-ico svg{width:30px;height:30px}.vg-arr{width:30px;height:30px}}
</style>

<div class="vg-box notranslate" translate="no">
  <a href="https://apm2.angpao.me/register" target="_blank" rel="noopener noreferrer" class="vg-btn btn-cta" data-fb-event="Lead">
    <div class="vg-in">
      <div class="vg-ico">
        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
      </div>
      <div class="vg-txt">
        <div class="vg-t">
          สมัครสมาชิก
          <span class="gsp s1">✦</span><span class="gsp s2">✦</span><span class="gsp s3">✦</span><span class="gsp s4">✦</span>
        </div>
        <div class="vg-s">ผ่านระบบ <span>แตะ</span></div>
      </div>
      <div class="vg-arr">
        <svg viewBox="0 0 24 24"><path d="M8.6 16.6L13.2 12 8.6 7.4 10 6l6 6-6 6z"/></svg>
      </div>
    </div>
  </a>
</div>
